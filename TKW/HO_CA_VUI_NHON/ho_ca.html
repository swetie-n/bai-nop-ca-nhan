<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ cá</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="mystyle.css">
</head>
<body>

    <!-- ========== MÀN 1: HỒ ban đêm ========== -->
    <section id="lake">
        <div id="sky" aria-hidden="true">
            <div class="stars"></div>
            <div class="glow"></div>
            <svg class="mount back"  data-speed="0.10" viewBox="0 0 1440 500" preserveAspectRatio="none"><path d="M0 500V300C60 290 90 250 140 270C190 290 210 250 260 230C300 215 320 250 380 280C430 300 470 230 520 190C560 160 590 200 630 240C680 280 720 260 780 250C840 240 880 280 940 270C1000 260 1040 200 1100 170C1150 145 1190 190 1240 230C1290 260 1360 240 1440 270V500Z"/></svg>
            <svg class="mount mid"   data-speed="0.18" viewBox="0 0 1440 500" preserveAspectRatio="none"><path d="M0 500V300C30 260 60 120 110 80C140 110 170 230 230 300C280 340 330 330 380 270C420 220 450 170 490 150C520 200 560 330 640 360C720 380 800 350 860 300C900 250 940 130 990 60C1030 20 1060 60 1090 130C1130 220 1180 330 1260 340C1340 345 1400 300 1440 260V500Z"/></svg>
            <svg class="mount front" data-speed="0.26" viewBox="0 0 1440 500" preserveAspectRatio="none"><path d="M0 500V380C80 360 140 340 220 360C300 380 360 400 440 420C560 440 700 430 820 440C960 450 1080 420 1200 400C1300 385 1380 370 1440 380V500Z"/></svg>
        </div>

        <div id="water" aria-hidden="true">
            <svg class="refl back" data-speed="-0.10" viewBox="0 0 1440 500" preserveAspectRatio="none"><path d="M0 500V300C60 290 90 250 140 270C190 290 210 250 260 230C300 215 320 250 380 280C430 300 470 230 520 190C560 160 590 200 630 240C680 280 720 260 780 250C840 240 880 280 940 270C1000 260 1040 200 1100 170C1150 145 1190 190 1240 230C1290 260 1360 240 1440 270V500Z"/></svg>
            <svg class="refl mid"  data-speed="-0.18" viewBox="0 0 1440 500" preserveAspectRatio="none"><path d="M0 500V300C30 260 60 120 110 80C140 110 170 230 230 300C280 340 330 330 380 270C420 220 450 170 490 150C520 200 560 330 640 360C720 380 800 350 860 300C900 250 940 130 990 60C1030 20 1060 60 1090 130C1130 220 1180 330 1260 340C1340 345 1400 300 1440 260V500Z"/></svg>
            <div class="ripples"></div>
        </div>

        <svg class="reeds left" data-speed="0.30" viewBox="0 0 300 300" preserveAspectRatio="xMinYMax meet" aria-hidden="true">
            <path d="M20 300C30 210 4 130 0 40C30 110 52 200 44 300Z"/>
            <path d="M60 300C80 220 70 150 110 70C100 150 112 220 96 300Z"/>
            <path d="M100 300C120 240 150 190 190 150C165 200 150 250 134 300Z"/>
            <path d="M140 300C150 260 190 230 250 215C200 245 180 270 172 300Z"/>
            <path d="M0 300C10 250 -10 200 -20 160C20 210 30 260 24 300Z"/>
        </svg>
        <svg class="reeds right" data-speed="0.30" viewBox="0 0 300 300" preserveAspectRatio="xMinYMax meet" aria-hidden="true">
            <path d="M20 300C30 210 4 130 0 40C30 110 52 200 44 300Z"/>
            <path d="M60 300C80 220 70 150 110 70C100 150 112 220 96 300Z"/>
            <path d="M100 300C120 240 150 190 190 150C165 200 150 250 134 300Z"/>
            <path d="M140 300C150 260 190 230 250 215C200 245 180 270 172 300Z"/>
        </svg>

        <h1>HỒ CÁ</h1>
    </section>

    <!-- ========== MÀN 2: DƯỚI NƯỚC (không chữ) ========== -->
    <section id="tank">
        <div class="bg" aria-hidden="true">
            <div class="plankton"></div>
            <div class="rays"></div>
            <svg class="rock far" viewBox="0 0 1440 300" preserveAspectRatio="none"><path d="M0 300V170L90 120 170 175 280 70 400 160 520 110 640 180 760 90 880 170 1010 60 1130 150 1250 100 1350 160 1440 120V300Z"/></svg>
            <svg class="rock mid" viewBox="0 0 1440 300" preserveAspectRatio="none"><path d="M0 300V190C80 150 130 200 230 160S380 100 470 170 600 210 720 150 880 90 990 160 1130 200 1240 140 1370 130 1440 170V300Z"/></svg>
            <div class="bubbles">
                <span style="--x:6%;  --s:10px; --d:14s; --t:0s"></span>
                <span style="--x:14%; --s:6px;  --d:11s; --t:3s"></span>
                <span style="--x:23%; --s:14px; --d:17s; --t:6s"></span>
                <span style="--x:34%; --s:8px;  --d:12s; --t:1s"></span>
                <span style="--x:47%; --s:12px; --d:16s; --t:8s"></span>
                <span style="--x:58%; --s:7px;  --d:10s; --t:4s"></span>
                <span style="--x:68%; --s:16px; --d:19s; --t:2s"></span>
                <span style="--x:77%; --s:9px;  --d:13s; --t:7s"></span>
                <span style="--x:86%; --s:6px;  --d:11s; --t:5s"></span>
                <span style="--x:94%; --s:11px; --d:15s; --t:9s"></span>
            </div>
        </div>

        <div id="shark"><img src="../HO_CA_VUI_NHON/img/shark.png" alt="Cá mập"></div>
        <div id="turtle"><img src="../HO_CA_VUI_NHON/img/turtle.png" alt="Rùa"></div>
        <div id="diver">
            <div class="diver"><img src="../HO_CA_VUI_NHON/img/diver1.png" alt="Thợ lặn 1"></div>
            <div class="diver"><img src="../HO_CA_VUI_NHON/img/diver2.png" alt="Thợ lặn 2"></div>
            <div class="diver"><img src="../HO_CA_VUI_NHON/img/diver3.png" alt="Thợ lặn 3"></div>
        </div>
        <div id="fish">
            <div class="fish"><img src="../HO_CA_VUI_NHON/img/faintSchool.png" alt="Đàn cá"></div>
            <div class="fish"><img src="../HO_CA_VUI_NHON/img/goldFishSchool.png" alt="Đàn cá vàng"></div>
        </div>

        <svg class="weed left" viewBox="0 0 260 340" aria-hidden="true">
            <path d="M30 340C10 260 50 200 20 110 60 190 45 260 60 340Z"/>
            <path d="M80 340C60 250 110 190 90 70 125 170 105 250 118 340Z"/>
            <path d="M140 340C130 280 170 240 160 170 190 240 175 290 182 340Z"/>
            <path d="M200 340C195 290 225 260 220 210 240 260 232 300 238 340Z"/>
        </svg>
        <svg class="weed right" viewBox="0 0 260 340" aria-hidden="true">
            <path d="M30 340C20 290 50 250 40 200 62 250 52 300 60 340Z"/>
            <path d="M90 340C70 260 120 200 100 100 135 190 115 260 128 340Z"/>
            <path d="M160 340C145 270 190 220 175 130 210 210 190 270 200 340Z"/>
            <path d="M225 340C215 290 245 260 238 220 258 270 250 305 255 340Z"/>
        </svg>
        <div class="sand" aria-hidden="true"></div>
    </section>

    <script src="parallax.js"></script>


</body>
</html>
