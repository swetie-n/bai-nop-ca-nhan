<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài nộp cá nhân - Nguyễn Đặng Huỳnh Nhi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #d9dadc;
            --ink: #151516;
            --white: #ffffff;
            --accent: #ff4b2b;
            --sans: "Be Vietnam Pro", "Helvetica Neue", Helvetica, Arial, "Segoe UI", sans-serif;
            --mono: ui-monospace, "SF Mono", Consolas, "Courier New", monospace;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            background: linear-gradient(180deg, #dcdddf 0%, #d4d5d8 100%);
            color: var(--ink);
            font-family: "Helvetica Neue", Helvetica, Arial, "Segoe UI", sans-serif;
            overflow: hidden;
        }
        #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

        .intro {
            position: fixed;
            left: clamp(20px, 4vw, 56px);
            top: clamp(22px, 5vh, 56px);
            z-index: 2;
            pointer-events: none;
            transition: opacity .3s;
        }
        .intro h1 {
            margin: 0;
            font-family: var(--sans);
            font-weight: 700;
            font-size: clamp(34px, 5.4vw, 84px);
            line-height: 1.12;
            letter-spacing: -0.04em;
        }
        .intro p { margin: 14px 0 0; font-family: var(--mono); font-size: 12px; }
        body.focus .intro { opacity: 0.12; }

        .index {
            position: fixed;
            left: clamp(20px, 4vw, 56px);
            bottom: 76px;
            z-index: 3;
            width: min(340px, 30vw);
        }
        .index a {
            display: grid;
            grid-template-columns: 34px 1fr auto;
            align-items: baseline;
            padding: 9px 0;
            border-top: 1px solid var(--ink);
            color: var(--ink);
            text-decoration: none;
        }
        .index a:last-child { border-bottom: 1px solid var(--ink); }
        .index .n { font-family: var(--mono); font-size: 12px; color: #6d6e72; }
        .index .t { font-family: var(--sans); font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
        .index .s { font-family: var(--mono); font-size: 11px; color: #6d6e72; }
        .index a:hover .n, .index a:focus-visible .n { color: var(--accent); }
        .index a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

        #cap {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 62px;
            z-index: 2;
            margin: 0;
            display: none;
            text-align: center;
            pointer-events: none;
        }
        #cap span {
            display: inline-block;
            padding: 4px 14px;
            background: var(--accent);
            color: var(--ink);
            font-family: var(--mono);
            font-size: 12px;
            font-weight: 700;
        }

        footer {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            gap: 16px;
            padding: 14px clamp(20px, 4vw, 56px);
            font-family: var(--mono);
            font-size: 12px;
            pointer-events: none;
        }

        @media (max-aspect-ratio: 17/20) {
            .index { left: 16px; right: 16px; width: auto; bottom: 44px; }
            .index a { padding: 6px 0; }
            .index .t { font-size: 17px; }
            .intro h1 { font-size: clamp(30px, 9vw, 52px); }
            #cap { bottom: 190px; }
            footer span:nth-child(2) { display: none; }
        }
    </style>
</head>
<body>
    <canvas id="gl"></canvas>

    <header class="intro">
        <h1>Bài nộp<br>cá nhân</h1>
        <p>COMP1802</p>
    </header>

    <nav class="index" id="index" aria-label="Danh sách bài tập">
        <a href="HO_CA_VUI_NHON/ho_ca.html" data-title="Hồ cá" data-sub="Hồ cá vui nhộn · CSS3"><span class="n">01</span><span class="t">Hồ cá</span><span class="s">Hồ cá vui nhộn · CSS3</span></a>
        <a href="6.1.3/index.html" data-title="CV cá nhân" data-sub="Trang CV · HTML/CSS"><span class="n">02</span><span class="t">CV cá nhân</span><span class="s">Trang CV · HTML/CSS</span></a>
        <a href="shop/html/trangchu.html" data-title="Cửa hàng" data-sub="Layout web · Bootstrap/JS"><span class="n">03</span><span class="t">Cửa hàng</span><span class="s">Layout web · Bootstrap/JS</span></a>
    </nav>

    <p id="cap"></p>

    <footer>
        <span>Nguyễn Đặng Huỳnh Nhi</span>
        <span>Thiết kế web 2026</span>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const canvas = document.getElementById('gl');
        const cap = document.getElementById('cap');
        const motion = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 1;

        const rows = [...document.querySelectorAll('#index a')];
        const themes = [
            [{ c1: '#1b1b1d', c2: '#3a3a3f', dark: true }, { c1: '#ff5a3a', c2: '#e0381a', dark: true }, { c1: '#f6f6f4', c2: '#cfd0d3', dark: false }],
            [{ c1: '#ff5a3a', c2: '#e0381a', dark: true }, { c1: '#f6f6f4', c2: '#cfd0d3', dark: false }, { c1: '#1b1b1d', c2: '#3a3a3f', dark: true }]
        ];
        const items = [];
        for (let j = 0; j < 2; j++) {
            rows.forEach((a, idx) => items.push(Object.assign({
                t: a.dataset.title, s: a.dataset.sub, href: a.getAttribute('href'), n: idx + 1, v: j
            }, themes[j][idx])));
        }

        let renderer = null;
        try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true }); } catch (e) {}

        if (renderer) {
            renderer.outputEncoding = THREE.sRGBEncoding;
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);

            const SANS = '"Be Vietnam Pro", "Helvetica Neue", Arial, sans-serif';
            const MONO = 'Consolas, "Courier New", monospace';

            function face(it) {
                const c = document.createElement('canvas');
                c.width = 1280; c.height = 800;
                const x = c.getContext('2d');
                const g = x.createLinearGradient(0, 0, 1280, 800);
                g.addColorStop(0, it.c1); g.addColorStop(1, it.c2);
                x.fillStyle = g; x.fillRect(0, 0, 1280, 800);
                const fg = it.dark ? '#ffffff' : '#151516';
                const mute = it.dark ? 'rgba(255,255,255,0.6)' : 'rgba(21,21,22,0.6)';
                x.strokeStyle = mute; x.lineWidth = 2;
                x.beginPath(); x.moveTo(60, 130); x.lineTo(1220, 130); x.stroke();
                x.fillStyle = mute; x.font = '500 30px ' + MONO;
                x.textAlign = 'left'; x.fillText(it.s, 60, 100);
                x.textAlign = 'right'; x.fillText('0' + it.n, 1220, 100);
                x.fillStyle = fg;
                if (it.v === 0) {
                    x.textAlign = 'left'; x.font = '700 180px ' + SANS;
                    x.fillText(it.t, 56, 700, 1170);
                } else {
                    x.textAlign = 'right'; x.font = '700 760px ' + SANS;
                    x.fillText(String(it.n), 1230, 740);
                    x.textAlign = 'left'; x.font = '700 80px ' + SANS;
                    x.fillText(it.t, 60, 730, 640);
                }
                const t = new THREE.CanvasTexture(c);
                t.encoding = THREE.sRGBEncoding;
                t.anisotropy = 8;
                return t;
            }

            function roundedGeo(r) {
                const s = new THREE.Shape();
                s.moveTo(-0.5 + r, -0.5);
                s.lineTo(0.5 - r, -0.5);
                s.quadraticCurveTo(0.5, -0.5, 0.5, -0.5 + r);
                s.lineTo(0.5, 0.5 - r);
                s.quadraticCurveTo(0.5, 0.5, 0.5 - r, 0.5);
                s.lineTo(-0.5 + r, 0.5);
                s.quadraticCurveTo(-0.5, 0.5, -0.5, 0.5 - r);
                s.lineTo(-0.5, -0.5 + r);
                s.quadraticCurveTo(-0.5, -0.5, -0.5 + r, -0.5);
                const g = new THREE.ShapeGeometry(s, 8);
                const p = g.attributes.position, uv = g.attributes.uv;
                for (let i = 0; i < p.count; i++) uv.setXY(i, p.getX(i) + 0.5, p.getY(i) + 0.5);
                return g;
            }

            const geo = roundedGeo(0.025);
            const plane = new THREE.PlaneGeometry(1, 1);
            const proxyMat = new THREE.MeshBasicMaterial({ visible: false, side: THREE.DoubleSide });
            const N = items.length;

            const cards = items.map((it, i) => {
                const mat = new THREE.MeshBasicMaterial({ map: face(it), transparent: true, side: THREE.DoubleSide });
                const mesh = new THREE.Mesh(geo, mat);
                const proxy = new THREE.Mesh(plane, proxyMat);
                mesh.userData.i = proxy.userData.i = i;
                scene.add(mesh, proxy);
                const u = { i, mesh, proxy, mat, aspect: 1.6, a: 0, o: 1, phase: i * 1.9, delay: 0.1 + i * 0.12 };
                return u;
            });
            const proxies = cards.map(c => c.proxy);

            if (document.fonts && document.fonts.load) {
                document.fonts.load('700 100px "Be Vietnam Pro"').then(() => {
                    cards.forEach(u => {
                        u.mat.map.dispose();
                        u.mat.map = face(items[u.i]);
                        u.mat.needsUpdate = true;
                    });
                }).catch(() => {});
            }

            let W = 4.4, R = 5, CX = 2.7, SPAN = 1.9, portrait = false;

            function layout() {
                const w = innerWidth, h = innerHeight, a = w / h;
                portrait = a < 0.85;
                renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
                renderer.setSize(w, h, false);
                camera.aspect = a;
                camera.updateProjectionMatrix();
                camera.position.z = portrait ? 13 : 9;
                W = portrait ? 3.1 : 4.4;
                R = portrait ? 5.4 : 5;
                CX = portrait ? 0 : Math.min(2.9, 0.25 * 6.55 * a);
            }

            const mouse = new THREE.Vector2(0, 0);
            const ray = new THREE.Raycaster();
            let active = -1, rowHover = -1, shown = -2, lastType = 'mouse', wasActive = false;

            function pick(e) {
                mouse.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
                ray.setFromCamera(mouse, camera);
                if (active >= 0 && ray.intersectObject(cards[active].mesh)[0]) return;
                const hit = ray.intersectObjects(proxies)[0];
                active = hit ? hit.object.userData.i : -1;
            }

            canvas.addEventListener('pointermove', pick);
            canvas.addEventListener('pointerdown', e => {
                lastType = e.pointerType;
                const before = active;
                pick(e);
                wasActive = before >= 0 && before === active;
            });
            canvas.addEventListener('pointerleave', () => { active = -1; });
            canvas.addEventListener('click', () => {
                if (active < 0) return;
                if (lastType === 'touch' && !wasActive) return;
                location.href = items[active].href;
            });
            rows.forEach((a, i) => {
                a.addEventListener('mouseenter', () => { rowHover = i; });
                a.addEventListener('mouseleave', () => { rowHover = -1; });
                a.addEventListener('focus', () => { rowHover = i; });
                a.addEventListener('blur', () => { rowHover = -1; });
            });
            addEventListener('resize', layout);
            layout();

            const clock = new THREE.Clock();
            const lerp = (a, b, k) => a + (b - a) * k;
            const ease = v => 1 - Math.pow(1 - v, 3);
            let flow = 0, speed = 1, last = 0;

            function frame() {
                const t = clock.getElapsedTime();
                const dt = Math.min(0.05, t - last);
                last = t;
                const target = rowHover >= 0 ? rowHover : active;

                speed += ((target >= 0 ? 0 : 1) - speed) * 0.08;
                flow += dt * 0.04 * speed * motion;

                camera.position.x += (mouse.x * 0.5 - camera.position.x) * 0.05;
                camera.position.y += (mouse.y * 0.3 - camera.position.y) * 0.05;
                camera.lookAt(0, 0, 0);

                const cz = 1.5;
                const d = camera.position.z - cz;
                const vh = 2 * Math.tan(camera.fov * Math.PI / 360) * d;
                const vw = vh * camera.aspect;

                cards.forEach((u, i) => {
                    const e = ease(Math.min(1, Math.max(0, (t - u.delay) / 1.2)));
                    u.a += ((target === i ? 1 : 0) - u.a) * 0.1;
                    u.o += (((target >= 0 && target !== i) ? 0.22 : 1) - u.o) * 0.12;
                    const k = u.a * u.a * (3 - 2 * u.a);

                    const p = (((i / N + flow) % 1) + 1) % 1;
                    const th = (p - 0.5) * SPAN;
                    const fade = Math.min(1, p / 0.1, (1 - p) / 0.1);

                    const px = CX - th * 0.8;
                    const py = R * Math.sin(th) - (1 - e) * 5;
                    const pz = R * (Math.cos(th) - 1) - th * 0.45;
                    const rx = -th * 0.6 + mouse.y * 0.06;
                    const ry = 0.32 + Math.sin(t * 0.4 + u.phase) * 0.04 * motion + mouse.x * 0.08;
                    const rz = -0.2 + th * 0.12;
                    const sw = W, sh = W / u.aspect;

                    u.proxy.position.set(px, py, pz);
                    u.proxy.rotation.set(rx, ry, rz);
                    u.proxy.scale.set(sw, sh, 1);

                    const cw = portrait ? Math.min(vw * 0.9, vh * 0.55 * u.aspect) : Math.min(vw * 0.5, vh * 0.68 * u.aspect);
                    const ch = cw / u.aspect;
                    u.mesh.position.set(lerp(px, 0, k), lerp(py, 0, k), lerp(pz, cz, k));
                    u.mesh.rotation.set(lerp(rx, 0, k), lerp(ry, 0, k), lerp(rz, 0, k));
                    u.mesh.scale.set(lerp(sw, cw, k), lerp(sh, ch, k), 1);
                    u.mesh.renderOrder = target === i ? 10 : 0;
                    u.mat.opacity = u.o * e * lerp(fade, 1, k);
                });

                if (shown !== target) {
                    shown = target;
                    document.body.classList.toggle('focus', target >= 0);
                    canvas.style.cursor = active >= 0 ? 'pointer' : 'default';
                    cap.style.display = target >= 0 ? 'block' : 'none';
                    if (target >= 0) cap.innerHTML = '<span>' + items[target].t + ' · ' + items[target].s + ' · bấm để mở</span>';
                }

                renderer.render(scene, camera);
                requestAnimationFrame(frame);
            }
            frame();
        }
    </script>
</body>
</html>
